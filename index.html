html { -webkit-text-size-adjust: 100%; }
body { background: var(--papier); color: var(--tinte); font: 17px/1.5 "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--blau); outline-offset: 2px; }
h1, h2, h3, .schrift { font-family: "Delius", "Avenir Next", sans-serif; font-weight: 400; line-height: 1.2; }
.huelle { width: min(1120px, 100%); margin: 0 auto; padding: 0 16px 40px; }
.klein { font-size: 15px; color: var(--grau); }
.ueber { color: var(--gruen-tief); font-size: 14px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; }
b { font-weight: 700; }

/* Kopf */
.kopf { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0 16px; flex-wrap: wrap; }
.marke { display: flex; align-items: center; gap: 8px; font: 22px "Delius", sans-serif; color: var(--gruen-tief); background: none; border: 0; padding: 4px 0; min-height: 44px; }
.marke-bild { width: 42px; height: 42px; object-fit: contain; }
.reiter { display: flex; gap: 4px; background: #fff; padding: 5px; border-radius: 999px; box-shadow: var(--schatten); }
.reiter button { min-height: 44px; padding: 0 16px; border: 0; background: none; border-radius: 999px; font-weight: 600; color: var(--grau); }
.reiter button[aria-current="page"] { background: var(--gruen); color: #fff; }

/* Knöpfe */
.knoepfe { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.knopf { display: inline-flex; align-items: center; justify-content: center; min-height: 50px; padding: 0 22px; border-radius: 14px; border: 0; background: var(--gruen); color: #fff; font-weight: 700; box-shadow: 0 3px 0 var(--gruen-tief); text-decoration: none; text-align: center; }
.knopf:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--gruen-tief); }
.knopf.zwei { background: #fff; color: var(--gruen-tief); box-shadow: inset 0 0 0 2px var(--gruen-mittel), 0 3px 0 var(--gruen-mittel); }
.knopf.rot { background: var(--nord); box-shadow: 0 3px 0 #a8382b; }
.knopf[disabled] { opacity: .45; cursor: default; transform: none; }
.klein-knopf { min-height: 44px; padding: 0 16px; font-size: 15px; }
.link { background: none; border: 0; color: var(--gruen-tief); font-weight: 700; text-decoration: underline; padding: 8px 0; min-height: 44px; }

/* Start */
.held { display: grid; grid-template-columns: 1fr 260px; gap: 16px; align-items: center; background: var(--karte); border-radius: var(--r); box-shadow: var(--schatten); padding: 26px; background-image: radial-gradient(circle at 92% 20%, var(--gruen-hell) 0, var(--gruen-hell) 140px, transparent 141px); }
.held h1 { font-size: clamp(30px, 4.6vw, 46px); color: var(--gruen-tief); margin: 6px 0 12px; }
.held p { max-width: 58ch; }
.held-bild img { width: 100%; max-width: 240px; display: block; margin: 0 auto; animation: wippen 4s ease-in-out infinite; }
@keyframes wippen { 50% { transform: translateY(-8px) rotate(-3deg); } }
.mini-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 14px 0 6px; }
.mini-stats div { background: var(--karte); border-radius: 16px; box-shadow: var(--schatten); padding: 12px 14px; display: flex; flex-direction: column; }
.mini-stats b { font: 24px "Delius", sans-serif; color: var(--gruen-tief); }
.mini-stats span { font-size: 14px; color: var(--grau); }
.abschnitt { font-size: 28px; color: var(--gruen-tief); margin: 26px 0 2px; }
.raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-top: 12px; }
.station { position: relative; display: flex; flex-direction: column; gap: 4px; text-align: left; border: 0; background: var(--karte); border-radius: var(--r); box-shadow: var(--schatten); padding: 16px 16px 18px; min-height: 230px; transition: transform .15s; overflow: hidden; }
.station:hover { transform: translateY(-3px); }
.station:nth-child(4n+1) { background: var(--gruen-hell); } .station:nth-child(4n+2) { background: var(--gelb-hell); } .station:nth-child(4n+3) { background: var(--blau-hell); } .station:nth-child(4n) { background: var(--koralle-hell); }
.station.selbst { outline: 3px dashed var(--gruen-mittel); outline-offset: -8px; }
.station .nr { position: absolute; top: 12px; left: 14px; width: 30px; height: 30px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-weight: 800; font-size: 15px; color: var(--gruen-tief); }
.station-bild { width: 100%; height: 110px; object-fit: contain; margin: 6px 0 6px; }
.station b { font: 21px "Delius", sans-serif; }
.station small { color: var(--grau); font-size: 15px; line-height: 1.35; }
.abzeichen { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 50%; background: var(--gelb); color: var(--tinte); display: grid; place-items: center; box-shadow: 0 2px 0 #d9a91d; }
.abzeichen svg { width: 22px; height: 22px; }
.abzeichen.gross { position: static; width: auto; height: auto; padding: 6px 14px; border-radius: 999px; display: inline-flex; gap: 6px; align-items: center; font-weight: 700; margin-left: auto; }
.ampel { align-self: flex-start; margin-top: 6px; font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
.ampel.rot { background: var(--koralle); color: #fff; } .ampel.gruen { background: var(--gruen); color: #fff; }

/* Station */
.station-kopf { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.kopf-bild { width: 96px; height: 96px; object-fit: contain; }
.station-kopf h1 { font-size: clamp(28px, 4vw, 40px); color: var(--gruen-tief); }
.wissen { display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; background: var(--karte); border-radius: var(--r); box-shadow: var(--schatten); padding: 22px; margin-bottom: 16px; }
.wissen h2 { font-size: 24px; color: var(--gruen-tief); margin-bottom: 8px; }
.wissen ul { padding-left: 20px; display: grid; gap: 8px; }
.wissen-bild { display: grid; place-items: center; }
.heft { margin-top: 12px; background: var(--gelb-hell); border-left: 5px solid var(--gelb); padding: 10px 14px; border-radius: 10px; font-size: 16px; }
.szene { width: 100%; height: auto; max-height: 260px; display: block; }
.klein-svg { max-width: 160px; margin: 0 auto; }
.hinweis-karte { display: flex; gap: 18px; align-items: center; background: var(--blau-hell); border-radius: var(--r); padding: 18px 22px; margin-bottom: 16px; }
.hinweis-karte h3 { font-size: 22px; margin-bottom: 4px; }
.hk-bild { width: 110px; height: 110px; object-fit: contain; flex: none; }
.hinweis-karte .knopf { margin-top: 10px; }

/* Üben */
.uebung { background: var(--karte); border-radius: var(--r); box-shadow: var(--schatten); padding: 22px; margin-bottom: 16px; }
.uebung-kopf { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.uebung-kopf h2 { font-size: 26px; color: var(--gruen-tief); }
.stufen, .segment, .raum-steuer { display: inline-flex; background: var(--gruen-hell); border-radius: 999px; padding: 4px; gap: 4px; flex-wrap: wrap; }
.stufen button, .segment button, .raum-steuer button { min-height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: none; font-weight: 700; color: var(--gruen-tief); }
.stufen button[aria-pressed="true"], .segment button[aria-pressed="true"], .raum-steuer button[aria-pressed="true"] { background: var(--gruen); color: #fff; }
.aufgabe-karte { margin-top: 16px; border: 2px solid var(--linie); border-radius: 18px; padding: 20px; }
.aufgabe-meta { font-size: 13px; font-weight: 700; color: var(--grau); text-transform: uppercase; letter-spacing: .03em; }
.frage { font-size: 22px; margin: 6px 0 12px; }
.bildflaeche { background: #fbfdfb; border: 1px solid var(--linie); border-radius: 14px; padding: 12px; margin-bottom: 14px; display: grid; place-items: center; }
.optionen { display: grid; gap: 10px; }
.optionen.bildopt { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.option { text-align: left; min-height: 54px; padding: 12px 16px; border-radius: 14px; border: 2px solid var(--linie); background: #fff; font-weight: 600; line-height: 1.35; }
.option:hover:not([disabled]) { border-color: var(--gruen-mittel); background: var(--gruen-hell); }
.option[aria-pressed="true"] { border-color: var(--gruen); background: var(--gruen-hell); }
.option.ist-falsch { border-color: var(--nord); background: var(--koralle-hell); }
.option.ist-richtig { border-color: var(--gruen); background: #d4f3df; box-shadow: inset 0 0 0 1px var(--gruen); }
.option[disabled] { cursor: default; }
.bildopt .option { padding: 8px; }
.pruefen { margin-top: 14px; }
.sortier { display: grid; gap: 8px; }
.sort-zeile { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; border: 2px solid var(--linie); border-radius: 14px; padding: 8px 12px; }
.sort-zeile > span { font-weight: 600; }
.sort-zeile.falsch-z { border-color: var(--nord); background: var(--koralle-hell); }
.sort-zeile.ok { border-color: var(--gruen); }
.sort-knoepfe { display: flex; gap: 6px; flex-wrap: wrap; }
.sort-knoepfe button { min-height: 44px; padding: 0 12px; border-radius: 10px; border: 2px solid var(--linie); background: #fff; font-size: 15px; font-weight: 600; }
.sort-knoepfe button[aria-pressed="true"] { background: var(--gruen); border-color: var(--gruen); color: #fff; }
.reihe { display: grid; gap: 8px; }
.reihe-schritt { display: flex; gap: 12px; align-items: center; text-align: left; min-height: 54px; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--linie); background: #fff; line-height: 1.35; }
.reihe-schritt .platz { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 2px dashed var(--gruen-mittel); display: grid; place-items: center; font-weight: 800; color: #fff; }
.reihe-schritt.gewaehlt { border-color: var(--gruen); background: var(--gruen-hell); }
.reihe-schritt.gewaehlt .platz { background: var(--gruen); border-style: solid; border-color: var(--gruen); }
.zahl-zeile { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.zahl-feld { width: 170px; min-height: 54px; font-size: 22px; padding: 0 14px; border-radius: 14px; border: 2px solid var(--gruen-mittel); }
.zahl-zeile .pruefen { margin-top: 0; }
.einheit { font-weight: 700; color: var(--grau); }
.rueck:empty { display: none; }
.rueck { margin-top: 16px; padding: 14px 16px; border-radius: 14px; background: var(--gruen-hell); display: grid; gap: 8px; }
.rueck.gut { background: #dff5e7; border-left: 6px solid var(--gruen); }
.rueck.schlecht { background: var(--gelb-hell); border-left: 6px solid var(--gelb); }
.urteil { font: 21px "Delius", sans-serif; }
.rueck .knopf { justify-self: start; margin-top: 4px; }
.weg { background: #fff; border-radius: 10px; padding: 10px 14px; font-family: "Menlo", "Consolas", monospace; font-size: 16px; display: grid; gap: 2px; }
.weg b { font-family: "Avenir Next", Arial, sans-serif; }
.loesung-reihe { padding-left: 22px; background: #fff; border-radius: 10px; padding: 10px 10px 10px 32px; }
.sort-loesung { background: #fff; border-radius: 10px; padding: 10px 14px; }
.muster { background: #fff; border: 2px dashed var(--gruen-mittel); border-radius: 14px; padding: 12px 16px; margin: 12px 0; display: grid; gap: 6px; }
.muster svg { max-height: 220px; }
.aufdecken { margin-top: 12px; }
.zaehler { font-weight: 700; color: var(--gruen-tief); }
.abzeichen-neu { display: flex; gap: 8px; align-items: center; font-weight: 800; background: var(--gelb); border-radius: 12px; padding: 8px 12px; justify-self: start; }
.abzeichen-neu svg { width: 22px; height: 22px; }
.em-paar { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
.em-karte { background: #fff; border: 2px solid var(--linie); border-radius: 12px; padding: 10px; }
.em-karte b { font: 20px "Delius", sans-serif; }
.em-karte ul { padding-left: 18px; font-size: 15px; }

/* Labore */
.labor { background: var(--karte); border-radius: var(--r); box-shadow: var(--schatten); padding: 22px; margin-bottom: 16px; }
.labor h2 { font-size: 24px; color: var(--gruen-tief); }
.labor-raster { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 12px; align-items: center; }
.regler { display: grid; gap: 4px; margin-bottom: 12px; }
.regler > span { font-weight: 700; font-size: 15px; }
.schieber { display: grid; gap: 4px; margin-bottom: 12px; font-size: 16px; }
.schieber input { width: 100%; height: 44px; accent-color: var(--gruen); }
.em-zahl { text-align: center; font-size: 18px; }
.em-zahl b { font: 32px "Delius", sans-serif; color: var(--gruen-tief); }
.formel-live { background: var(--gruen-hell); border-radius: 12px; padding: 12px 14px; font-size: 17px; display: grid; gap: 4px; }

/* 3D */
.raum { background: var(--karte); border-radius: var(--r); box-shadow: var(--schatten); padding: 18px; margin-bottom: 16px; }
.raum-feld { position: relative; margin-top: 12px; border-radius: 16px; overflow: hidden; background: radial-gradient(circle at 50% 45%, #ffffff 0, #eef6f0 70%); border: 1px solid var(--linie); }
#raum-canvas { display: block; width: 100%; height: min(62vh, 480px); touch-action: none; cursor: grab; }
.raum-hinweis { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); background: rgba(255, 255, 255, .85); padding: 2px 12px; border-radius: 999px; font-size: 13px; color: var(--grau); pointer-events: none; white-space: nowrap; }
.raum-unten { display: flex; gap: 12px; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-top: 10px; }
.raum-unten p { max-width: 60ch; }
.raum-unten .knoepfe { margin-top: 0; }

/* Selbstlernen */
.teil-reiter { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.teil-reiter button { min-height: 48px; padding: 0 18px; border-radius: 14px; border: 2px solid var(--gruen-mittel); background: #fff; font-weight: 700; color: var(--gruen-tief); }
.teil-reiter button[aria-selected="true"] { background: var(--gruen); color: #fff; border-color: var(--gruen); }
.schritt-punkte { display: flex; gap: 8px; margin: 10px 0 14px; }
.schritt-punkte button { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--gruen-mittel); background: #fff; font-weight: 800; color: var(--gruen-tief); }
.schritt-punkte button.fertig { background: var(--gruen-hell); }
.schritt-punkte button.jetzt { background: var(--gruen); color: #fff; border-color: var(--gruen); }
.schritt-punkte button[disabled] { opacity: .4; }
.schritt-karte, .heft-karte { background: var(--karte); border-radius: var(--r); box-shadow: var(--schatten); padding: 22px; margin-bottom: 16px; }
.schritt-karte h2, .heft-karte h2 { font-size: 26px; color: var(--gruen-tief); margin: 4px 0 10px; }
.schritt-raster { display: grid; grid-template-columns: 1.2fr 1fr; gap: 18px; align-items: center; }
.schritt-anim { display: grid; gap: 8px; }
.anim-bild { width: 100%; max-height: 190px; object-fit: contain; }
.heft-zeile { font-size: 18px; line-height: 2.4; margin-bottom: 6px; }
.luecke { min-width: 150px; width: 11em; max-width: 100%; min-height: 44px; border: 0; border-bottom: 3px solid var(--gruen-mittel); background: var(--gruen-hell); border-radius: 8px 8px 0 0; padding: 0 10px; font-size: 17px; }
.luecke.ok { border-color: var(--gruen); background: #d4f3df; }
.luecke.falsch { border-color: var(--nord); background: var(--koralle-hell); }
.anim-klein { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }

/* Lauf, Checkliste */
.lauf-kopf { margin-bottom: 6px; }
.lauf-kopf h1 { font-size: 34px; color: var(--gruen-tief); }
.fortschritt, .balken { height: 12px; background: var(--gruen-hell); border-radius: 999px; overflow: hidden; margin: 10px 0 6px; }
.fortschritt div, .balken div { height: 100%; background: var(--gruen); border-radius: 999px; transition: width .3s; }
.kann-text { font: 20px "Delius", sans-serif; color: var(--gruen-tief); }
.ende { background: var(--karte); border-radius: var(--r); box-shadow: var(--schatten); padding: 26px; text-align: center; display: grid; gap: 12px; justify-items: center; }
.ende h1 { font-size: 34px; color: var(--gruen-tief); }
.ende p { max-width: 60ch; }
.ende-bild { width: 150px; height: 150px; object-fit: contain; }
.check-liste { display: grid; gap: 8px; width: min(520px, 100%); }
.check-zeile { display: flex; gap: 10px; align-items: center; text-align: left; min-height: 48px; padding: 8px 14px; border-radius: 12px; border: 2px solid var(--linie); background: #fff; font-weight: 600; }
.check-zeile .punkt { width: 16px; height: 16px; border-radius: 50%; flex: none; }
.check-zeile.rot .punkt { background: var(--koralle); } .check-zeile.gruen .punkt { background: var(--gruen); }
.liste-kopf { display: grid; grid-template-columns: 1fr 180px; gap: 16px; align-items: center; background: var(--karte); border-radius: var(--r); box-shadow: var(--schatten); padding: 22px; margin-bottom: 16px; }
.liste-kopf h1 { font-size: 34px; color: var(--gruen-tief); }
.liste-kopf .knopf { margin-top: 10px; }
.liste-bild { width: 100%; max-height: 180px; object-fit: contain; }
.liste-gruppe { background: var(--karte); border-radius: var(--r); box-shadow: var(--schatten); padding: 18px 22px; margin-bottom: 12px; }
.liste-gruppe h2 { font-size: 22px; display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
.gruppen-nr { width: 32px; height: 32px; border-radius: 50%; background: var(--gruen-hell); color: var(--gruen-tief); display: grid; place-items: center; font: 800 16px "Avenir Next", Arial, sans-serif; flex: none; }
.kann { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--linie); }
.kasten { width: 32px; height: 32px; border-radius: 8px; border: 2.5px solid var(--gruen-mittel); display: grid; place-items: center; color: #fff; }
.kann.ja .kasten { background: var(--gruen); border-color: var(--gruen); }
.kasten svg { width: 22px; height: 22px; }

/* Lernpass */
.pass { background: var(--karte); border-radius: var(--r); box-shadow: var(--schatten); padding: 26px; }
.pass-kopf { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.pass-kopf h1 { font-size: 38px; color: var(--gruen-tief); }
.pass-bild { width: 130px; height: 130px; object-fit: contain; }
.pass-zahlen { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 20px 0; }
.pz { background: var(--gruen-hell); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 2px; }
.pz b { font: 32px "Delius", sans-serif; color: var(--gruen-tief); }
.pz span { font-weight: 700; }
.pz small { color: var(--grau); font-size: 14px; }
.code-box { border: 3px dashed var(--gruen); border-radius: 16px; padding: 16px; text-align: center; display: grid; gap: 4px; }
.code-box span { font-weight: 700; color: var(--grau); text-transform: uppercase; font-size: 14px; letter-spacing: .05em; }
.code-box b { font: 700 clamp(17px, 5.4vw, 36px) "Menlo", "Consolas", monospace; letter-spacing: .04em; color: var(--tinte); white-space: nowrap; }
.regeln { margin-top: 16px; border-top: 1px solid var(--linie); padding-top: 12px; }
.regeln summary { font-weight: 700; cursor: pointer; min-height: 44px; display: flex; align-items: center; }
.regeln ul { padding-left: 20px; display: grid; gap: 6px; font-size: 16px; }
.regeln .knopf { margin-top: 10px; }
.fuss { margin-top: 28px; text-align: center; font-size: 13px; color: var(--grau); }

/* Schmale Bildschirme */
@media (min-width: 560px) and (max-width: 1000px) { .raster { grid-template-columns: 1fr 1fr; } }
@media (max-width: 820px) {
  .held, .wissen, .labor-raster, .schritt-raster, .liste-kopf { grid-template-columns: 1fr; }
  .held-bild img { max-width: 170px; }
  .mini-stats, .pass-zahlen { grid-template-columns: 1fr 1fr; }
  .liste-bild { display: none; }
}
@media (max-width: 520px) {
  .reiter button { padding: 0 11px; font-size: 15px; }
  .marke span { display: none; }
  .em-paar, .anim-klein { grid-template-columns: 1fr; }
  .kann { grid-template-columns: 32px 1fr; }
  .kann .knopf { grid-column: 2; justify-self: start; }
  .hinweis-karte { flex-direction: column; align-items: flex-start; }
  .frage { font-size: 20px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* Druck: nur der Lernpass */
@media print {
  body { background: #fff; }
  .kopf, .fuss, .knoepfe, .regeln { display: none !important; }
  .pass { box-shadow: none; padding: 0; }
  .pz { border: 1px solid #b9e6cb; }
  @page { margin: 15mm; }
}

</style>
</head>

   Farben wie im Unterricht: Nordpol rot, Südpol grün, Elektronen blau. */
(function (root) {
  "use strict";
  const ROT = "#e2503f", GRUEN = "#3f9d57", TINTE = "#1d2b26", BLAU = "#2f6fd6", KUPFER = "#c8742f", GRAU = "#8c99a3";

  /* ---------- Stabmagnet ---------- */
  // links: Pol am linken Ende ("N" oder "S"); txt: Polbuchstaben anzeigen (sonst "?" möglich über frage)
  function stab(x, y, w, h, links, opt = {}) {
    const rechts = links === "N" ? "S" : "N";
    const f = p => (p === "N" ? ROT : GRUEN);
    // fragLinks/fragRechts: dieser Pol zeigt "?"; der andere Pol wird dann grau verdeckt, sonst verrät er die Lösung
    const verdeckt = opt.fragLinks || opt.fragRechts;
    const lText = opt.fragLinks ? "?" : verdeckt ? "" : links, rText = opt.fragRechts ? "?" : verdeckt ? "" : rechts;
    const lFill = opt.fragLinks ? "#fff" : verdeckt ? "#c9d0d5" : f(links), rFill = opt.fragRechts ? "#fff" : verdeckt ? "#c9d0d5" : f(rechts);
    return `<g><rect x="${x}" y="${y}" width="${w / 2}" height="${h}" rx="4" fill="${lFill}" stroke="${TINTE}" stroke-width="2.5"/>` +
      `<rect x="${x + w / 2}" y="${y}" width="${w / 2}" height="${h}" rx="4" fill="${rFill}" stroke="${TINTE}" stroke-width="2.5"/>` +
      `<text x="${x + w / 4}" y="${y + h / 2 + 7}" text-anchor="middle" font-size="20" font-weight="800" fill="${opt.fragLinks ? TINTE : "#fff"}">${lText}</text>` +
      `<text x="${x + 3 * w / 4}" y="${y + h / 2 + 7}" text-anchor="middle" font-size="20" font-weight="800" fill="${opt.fragRechts ? TINTE : "#fff"}">${rText}</text></g>`;
  }

  // Zwei Stabmagnete nebeneinander. a, b: linker Pol des jeweiligen Magneten.
  function magnetPaar(a, b, opt = {}) {
    return `<svg viewBox="0 0 340 90" class="szene">${stab(14, 25, 140, 40, a, { fragRechts: opt.fragA })}${stab(186, 25, 140, 40, b, { fragLinks: opt.fragB })}</svg>`;
  }

  // Ringmagnete auf einem Stab, oberer schwebt
  function ringe() {
    return `<svg viewBox="0 0 200 200" class="szene"><rect x="94" y="20" width="12" height="160" rx="6" fill="#d9dee2" stroke="${TINTE}" stroke-width="2"/>
      <rect x="40" y="150" width="120" height="16" rx="5" fill="${GRUEN}" stroke="${TINTE}" stroke-width="2.5"/><rect x="40" y="166" width="120" height="16" rx="5" fill="${ROT}" stroke="${TINTE}" stroke-width="2.5"/>
      <rect x="40" y="70" width="120" height="16" rx="5" fill="${ROT}" stroke="${TINTE}" stroke-width="2.5"/><rect x="40" y="86" width="120" height="16" rx="5" fill="${GRUEN}" stroke="${TINTE}" stroke-width="2.5"/>
      <rect x="94" y="70" width="12" height="32" fill="#d9dee2" stroke="${TINTE}" stroke-width="2"/><rect x="94" y="150" width="12" height="32" fill="#d9dee2" stroke="${TINTE}" stroke-width="2"/>
      <path d="M30 112v26M170 112v26" stroke="${GRAU}" stroke-width="3" stroke-dasharray="4 4"/><path d="M24 118l6-8 6 8M164 118l6-8 6 8" fill="none" stroke="${GRAU}" stroke-width="3"/>
      <text x="60" y="130" text-anchor="middle" font-size="14" fill="${GRAU}">Luft</text></svg>`;
  }

  // Kompass mit Nadel, Winkel in Grad (0 = Nadel-Nordspitze nach oben)
  function kompass(cx, cy, r, winkel) {
    return `<g><circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="${TINTE}" stroke-width="2.5"/>` +
      `<g transform="rotate(${winkel} ${cx} ${cy})"><path d="M${cx} ${cy - r * .8} L${cx + r * .22} ${cy} L${cx - r * .22} ${cy}Z" fill="${ROT}"/>` +
      `<path d="M${cx} ${cy + r * .8} L${cx + r * .22} ${cy} L${cx - r * .22} ${cy}Z" fill="#c7ced3"/></g><circle cx="${cx}" cy="${cy}" r="${r * .1}" fill="${TINTE}"/></g>`;
  }

  /* ---------- Feldlinien eines Stabmagneten (2D, berechnet) ---------- */
  // Zwei "Polladungen": N bei (+d,0), S bei (-d,0). Linien starten am Nordpol und enden am Südpol.
  function feldStabLinien(d = 60) {
    const q = [{ x: d, y: 0, s: 1 }, { x: -d, y: 0, s: -1 }];
    const B = (x, y) => { let bx = 0, by = 0; q.forEach(p => { const dx = x - p.x, dy = y - p.y, r2 = dx * dx + dy * dy, r3 = Math.pow(r2, 1.5) || 1e-9; bx += p.s * dx / r3; by += p.s * dy / r3; }); return [bx, by]; };
    const linien = [];
    const winkel = [88, 98, 110, 124, 140];
    [1, -1].forEach(seite => winkel.forEach(w => {
      const a = w * Math.PI / 180; let x = d + 6 * Math.cos(a), y = seite * 6 * Math.sin(a); const pts = [[x, y]];
      for (let i = 0; i < 4000; i++) {
        const [bx, by] = B(x, y), n = Math.hypot(bx, by); x += 1.5 * bx / n; y += 1.5 * by / n; pts.push([x, y]);
        if (Math.hypot(x + d, y) < 5 || Math.abs(x) > 400 || Math.abs(y) > 300) break;
      }
      linien.push(pts);
    }));
    return linien;
  }
  let _stabCache = null;
  function pfad(pts, sx, sy, ox, oy) { return "M" + pts.filter((p, i) => i % 3 === 0 || i === pts.length - 1).map(p => (ox + p[0] * sx).toFixed(1) + " " + (oy + p[1] * sy).toFixed(1)).join("L"); }
  function pfeil(x, y, ang, farbe = TINTE) {
    return `<path d="M-6 -5 L5 0 L-6 5Z" fill="${farbe}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(ang * 180 / Math.PI).toFixed(1)})"/>`;
  }
  // opt: nordLinks (bool), richtung "NS" (richtig) oder "SN" (falsch), fehler: "kreuz" | "offen" | null, punkte: [{n:"A",x,y}]
  function feldStab(opt = {}) {
    if (!_stabCache) _stabCache = feldStabLinien();
    const W = 340, H = 230, ox = W / 2, oy = H / 2, sx = opt.nordLinks ? -1 : 1;
    let s = `<svg viewBox="0 0 ${W} ${H}" class="szene">`;
    _stabCache.forEach((pts, k) => {
      if (opt.fehler === "offen" && k % 5 > 2) pts = pts.slice(0, Math.floor(pts.length * .55));
      s += `<path d="${pfad(pts, sx, 1, ox, oy)}" fill="none" stroke="${TINTE}" stroke-width="1.6" opacity=".8"/>`;
      const m = pts[Math.floor(pts.length / 2)], m2 = pts[Math.floor(pts.length / 2) + 2] || m;
      let ang = Math.atan2(m2[1] - m[1], (m2[0] - m[0]) * sx);
      if (opt.richtung === "SN") ang += Math.PI;
      if (Math.abs(ox + m[0] * sx - ox) < W / 2 && Math.abs(m[1]) < H / 2) s += pfeil(ox + m[0] * sx, oy + m[1], ang);
    });
    if (opt.fehler === "kreuz") s += `<path d="M${ox - 120} ${oy - 95} C ${ox - 40} ${oy - 20}, ${ox + 40} ${oy - 110}, ${ox + 120} ${oy - 40}" fill="none" stroke="${TINTE}" stroke-width="1.6" opacity=".8"/>`;
    s += stab(ox - 70, oy - 16, 140, 32, opt.nordLinks ? "N" : "S");
    (opt.punkte || []).forEach(p => { s += `<circle cx="${p.x}" cy="${p.y}" r="13" fill="#ffd24d" stroke="${TINTE}" stroke-width="2"/><text x="${p.x}" y="${p.y + 5}" text-anchor="middle" font-size="14" font-weight="800">${p.n}</text>`; });
    return s + `</svg>`;
  }

  // Eisenfeilspäne als Strichel entlang der berechneten Feldlinien
  function spaene() {
    if (!_stabCache) _stabCache = feldStabLinien();
    const W = 340, H = 230, ox = W / 2, oy = H / 2;
    let s = `<svg viewBox="0 0 ${W} ${H}" class="szene"><rect x="4" y="4" width="${W - 8}" height="${H - 8}" rx="12" fill="#fbf8ef" stroke="#e4dcc7"/>`;
    _stabCache.forEach(pts => { for (let i = 4; i < pts.length - 4; i += 9) { const [x, y] = pts[i], [x2, y2] = pts[i + 3]; const X = ox + x, Y = oy + y; if (X < 10 || X > W - 10 || Y < 10 || Y > H - 10) continue; s += `<path d="M${X.toFixed(1)} ${Y.toFixed(1)}L${(ox + x2).toFixed(1)} ${(oy + y2).toFixed(1)}" stroke="#55606a" stroke-width="1.6" stroke-linecap="round"/>`; } });
    return s + stab(ox - 70, oy - 16, 140, 32, "S") + `</svg>`;
  }

  /* ---------- Hufeisen ---------- */
  function hufeisen() {
    return `<svg viewBox="0 0 260 200" class="szene"><path d="M70 30 v90 a60 60 0 0 0 120 0 v-90" fill="none" stroke="${TINTE}" stroke-width="44" stroke-linecap="butt"/>
      <path d="M70 30 v90 a60 60 0 0 0 60 60" fill="none" stroke="${ROT}" stroke-width="38"/><path d="M190 30 v90 a60 60 0 0 1 -60 60" fill="none" stroke="${GRUEN}" stroke-width="38"/>
      <text x="70" y="52" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">N</text><text x="190" y="52" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">S</text>
      ${[40, 62, 84, 106].map(y => `<path d="M95 ${y} H165" stroke="${TINTE}" stroke-width="1.6"/>` + pfeil(132, y, 0)).join("")}</svg>`;
  }

  /* ---------- Elementarmagnete ---------- */
  // geordnet: alle zeigen nach rechts; sonst zufällig (rng)
  function elementar(geordnet, rng = Math.random, titel = "") {
    let s = `<svg viewBox="0 0 260 110" class="szene"><rect x="10" y="20" width="230" height="70" rx="10" fill="#e6e9ec" stroke="${TINTE}" stroke-width="2.5"/><path d="M240 30 l14 25 -14 25" fill="#e6e9ec" stroke="${TINTE}" stroke-width="2.5"/>`;
    for (let r = 0; r < 3; r++) for (let c = 0; c < 9; c++) {
      const x = 30 + c * 24, y = 36 + r * 20, a = geordnet ? 0 : Math.floor(rng() * 360);
      s += `<g transform="rotate(${a} ${x} ${y})"><rect x="${x - 9}" y="${y - 4}" width="9" height="8" fill="${GRUEN}"/><rect x="${x}" y="${y - 4}" width="9" height="8" fill="${ROT}"/></g>`;
    }
    if (titel) s += `<text x="125" y="14" text-anchor="middle" font-size="13" fill="${GRAU}">${titel}</text>`;
    return s + `</svg>`;
  }

  /* ---------- Draht im Querschnitt (Linke-Hand-Regel) ---------- */
  // elektronen: "zu" (auf dich zu, Punkt) oder "weg" (von dir weg, Kreuz). kreis: null | "uhr" | "gegen". kompass: null | "oben" | "unten" | "links" | "rechts"
  function drahtQuer(elektronen, kreis = null, kompassPos = null) {
    const cx = 130, cy = 110;
    let s = `<svg viewBox="0 0 260 220" class="szene">`;
    if (kreis) {
      s += `<circle cx="${cx}" cy="${cy}" r="62" fill="none" stroke="${BLAU}" stroke-width="2.5" stroke-dasharray="6 5"/>`;
      // Pfeile an oben/unten: im Uhrzeigersinn oben nach rechts
      const u = kreis === "uhr" ? 0 : Math.PI;
      s += pfeil(cx, cy - 62, u, BLAU) + pfeil(cx, cy + 62, u + Math.PI, BLAU) + pfeil(cx + 62, cy, u + Math.PI / 2, BLAU) + pfeil(cx - 62, cy, u - Math.PI / 2, BLAU);
    }
    s += `<circle cx="${cx}" cy="${cy}" r="24" fill="#f3d2b3" stroke="${KUPFER}" stroke-width="4"/>`;
    s += elektronen === "zu" ? `<circle cx="${cx}" cy="${cy}" r="6" fill="${TINTE}"/>` : `<path d="M${cx - 10} ${cy - 10}L${cx + 10} ${cy + 10}M${cx + 10} ${cy - 10}L${cx - 10} ${cy + 10}" stroke="${TINTE}" stroke-width="4" stroke-linecap="round"/>`;
    if (kompassPos) {
      const pos = { oben: [cx, cy - 86], unten: [cx, cy + 86], links: [cx - 96, cy], rechts: [cx + 96, cy] }[kompassPos];
      s += `<circle cx="${pos[0]}" cy="${pos[1]}" r="18" fill="#fff" stroke="${TINTE}" stroke-width="2.5"/><text x="${pos[0]}" y="${pos[1] + 6}" text-anchor="middle" font-size="18" font-weight="800">?</text>`;
    }
    return s + `</svg>`;
  }

  /* ---------- Draht über Kompass (Oersted) ---------- */
  function oersted(strom) {
    return `<svg viewBox="0 0 320 170" class="szene"><rect x="20" y="20" width="70" height="30" rx="6" fill="#3a3f45"/><rect x="90" y="27" width="8" height="16" fill="${KUPFER}"/>
      <path d="M20 35 H8 V90 H40 M98 35 H312 V90 H280" fill="none" stroke="${TINTE}" stroke-width="2.5"/>
      <path d="M40 90 H280" stroke="${KUPFER}" stroke-width="5"/>${kompass(160, 125, 34, strom ? 62 : 0)}
      ${strom ? `<text x="160" y="80" text-anchor="middle" font-size="13" fill="${BLAU}">Strom fließt</text>` : `<text x="160" y="80" text-anchor="middle" font-size="13" fill="${GRAU}">kein Strom</text>`}</svg>`;
  }

  /* ---------- Spule ---------- */
  function spule(windungen = 6, opt = {}) {
    const x0 = 70, w = 160, dx = w / windungen;
    let s = `<svg viewBox="0 0 300 150" class="szene">`;
    if (opt.kern) s += `<rect x="${x0 - 14}" y="62" width="${w + 28}" height="26" rx="4" fill="${opt.kern === "kupfer" ? "#e2a46f" : opt.kern === "holz" ? "#d9b98a" : "#aab3ba"}" stroke="${TINTE}" stroke-width="2"/>`;
    for (let i = 0; i < windungen; i++) s += `<ellipse cx="${x0 + dx * (i + .5)}" cy="75" rx="${dx * .42}" ry="34" fill="none" stroke="${KUPFER}" stroke-width="4"/>`;
    s += `<path d="M${x0 + dx * .1} 105 V135 H30 M${x0 + w - dx * .1} 105 V135 H270" fill="none" stroke="${TINTE}" stroke-width="2"/>`;
    if (opt.pole) s += `<text x="${x0 - 30}" y="82" font-size="22" font-weight="800" fill="${opt.pole[0] === "N" ? ROT : GRUEN}">${opt.pole[0]}</text><text x="${x0 + w + 16}" y="82" font-size="22" font-weight="800" fill="${opt.pole[1] === "N" ? ROT : GRUEN}">${opt.pole[1]}</text>`;
    return s + `</svg>`;
  }

  /* ---------- Elektromagnet-Karte ---------- */
  function emKarte(name, windungen, strom, kern) {
    const kernTxt = { eisen: "Eisenkern", ohne: "ohne Kern", kupfer: "Kupferkern", holz: "Holzkern" }[kern];
    return `<div class="em-karte"><b>${name}</b>${spule(Math.round(windungen / 100) + 2, { kern: kern === "ohne" ? null : kern })}<ul><li>${windungen} Windungen</li><li>Stromstärke ${strom}</li><li>${kernTxt}</li></ul></div>`;
  }

  /* ---------- Elektromotor (vereinfacht, Draufsicht) ---------- */
  // nummern: Objekt teil -> Nummer, z.B. {staender:1, laeufer:2, polwender:3}
  function motor(nummern) {
    const tag = (n, x, y) => n ? `<circle cx="${x}" cy="${y}" r="14" fill="#ffd24d" stroke="${TINTE}" stroke-width="2"/><text x="${x}" y="${y + 5}" text-anchor="middle" font-size="15" font-weight="800">${n}</text>` : "";
    return `<svg viewBox="0 0 340 220" class="szene">
      <path d="M40 40 h50 v140 h-50z" fill="${ROT}" stroke="${TINTE}" stroke-width="2.5"/><text x="65" y="117" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">N</text>
      <path d="M250 40 h50 v140 h-50z" fill="${GRUEN}" stroke="${TINTE}" stroke-width="2.5"/><text x="275" y="117" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">S</text>
      <rect x="120" y="92" width="100" height="36" rx="6" fill="#aab3ba" stroke="${TINTE}" stroke-width="2.5"/>
      ${[0, 1, 2, 3, 4, 5].map(i => `<ellipse cx="${132 + i * 15}" cy="110" rx="6" ry="24" fill="none" stroke="${KUPFER}" stroke-width="3.5"/>`).join("")}
      <path d="M170 128 V170" stroke="${TINTE}" stroke-width="5"/>
      <path d="M152 172 a18 18 0 0 1 16 -2 v24 a18 18 0 0 1 -16 -4z" fill="${KUPFER}" stroke="${TINTE}" stroke-width="2"/><path d="M188 172 a18 18 0 0 0 -16 -2 v24 a18 18 0 0 0 16 -4z" fill="${KUPFER}" stroke="${TINTE}" stroke-width="2"/>
      <rect x="128" y="176" width="16" height="12" fill="#555"/><rect x="196" y="176" width="16" height="12" fill="#555"/><path d="M128 182 H104 V205 M212 182 H236 V205" fill="none" stroke="${TINTE}" stroke-width="2"/>
      ${tag(nummern.staender, 65, 24)}${tag(nummern.laeufer, 170, 70)}${tag(nummern.polwender, 236, 160)}</svg>`;
  }

  /* ---------- Induktion: Magnet und Spule mit Messgerät ---------- */
  // bewegung: "rein" | "raus" | "ruhe"
  function induktion(bewegung) {
    const zeiger = bewegung === "rein" ? 35 : bewegung === "raus" ? -35 : 0;
    const pf = bewegung === "rein" ? `<path d="M40 50 h40" stroke="${BLAU}" stroke-width="4"/>${pfeil(84, 50, 0, BLAU)}` : bewegung === "raus" ? `<path d="M84 50 h-40" stroke="${BLAU}" stroke-width="4"/>${pfeil(40, 50, Math.PI, BLAU)}` : `<text x="62" y="46" text-anchor="middle" font-size="13" fill="${GRAU}">ruht</text>`;
    let s = `<svg viewBox="0 0 340 200" class="szene">${pf}${stab(20, 60, 110, 30, "S")}`;
    for (let i = 0; i < 7; i++) s += `<ellipse cx="${160 + i * 16}" cy="75" rx="7" ry="32" fill="none" stroke="${KUPFER}" stroke-width="4"/>`;
    s += `<path d="M160 107 V150 H210 M256 107 V150 H230" fill="none" stroke="${TINTE}" stroke-width="2"/>
      <rect x="200" y="130" width="70" height="56" rx="8" fill="#fff" stroke="${TINTE}" stroke-width="2.5"/><path d="M212 172 a24 24 0 0 1 46 0" fill="none" stroke="${GRAU}" stroke-width="2"/>
      <path d="M235 176 V146" stroke="${ROT}" stroke-width="3" stroke-linecap="round" transform="rotate(${zeiger} 235 176)"/><circle cx="235" cy="176" r="3.5" fill="${TINTE}"/></svg>`;
    return s;
  }

  /* ---------- Spannung-Zeit-Diagramme ---------- */
  // art: "gleich" | "wechsel" | "null" | "zacken"
  function diagramm(art, klein = false) {
    const W = 220, H = 120, oy = 62;
    let p = "";
    if (art === "gleich") p = `M20 34 H210`;
    else if (art === "null") p = `M20 ${oy} H210`;
    else if (art === "zacken") p = `M20 ${oy} L50 30 L50 ${oy} L80 30 L80 ${oy} L110 30 L110 ${oy} L140 30 L140 ${oy} L170 30 L170 ${oy} L200 30`;
    else { p = "M20 " + oy; for (let x = 20; x <= 210; x += 3) p += ` L${x} ${(oy - 32 * Math.sin((x - 20) / 190 * 4 * Math.PI)).toFixed(1)}`; }
    return `<svg viewBox="0 0 ${W} ${H}" class="szene${klein ? " klein-svg" : ""}"><path d="M20 10 V110 M20 ${oy} H214" stroke="${TINTE}" stroke-width="2"/>${pfeil(214, oy, 0)}${pfeil(20, 8, -Math.PI / 2)}
      <text x="26" y="16" font-size="12" fill="${GRAU}">U</text><text x="200" y="${oy + 18}" font-size="12" fill="${GRAU}">t</text><path d="${p}" fill="none" stroke="${BLAU}" stroke-width="3.5" stroke-linejoin="round"/></svg>`;
  }

  /* ---------- Transformator ---------- */
  // w: {n1, n2, u1, u2} als Text (auch "?"); nummern: optional {spule1, spule2, kern}
  function trafo(w = {}, nummern = null) {
    const n1 = Number(String(w.n1).replace(/\D/g, "")) || 400, n2 = Number(String(w.n2).replace(/\D/g, "")) || 400;
    const k1 = Math.max(3, Math.min(10, Math.round(2 + 8 * n1 / Math.max(n1, n2)))), k2 = Math.max(3, Math.min(10, Math.round(2 + 8 * n2 / Math.max(n1, n2))));
    const sp = (x, k) => Array.from({ length: k }, (_, i) => `<ellipse cx="${x}" cy="${62 + i * (96 / k) + 48 / k}" rx="30" ry="${Math.min(7, 40 / k)}" fill="none" stroke="${KUPFER}" stroke-width="4"/>`).join("");
    const tag = (n, x, y) => n ? `<circle cx="${x}" cy="${y}" r="14" fill="#ffd24d" stroke="${TINTE}" stroke-width="2"/><text x="${x}" y="${y + 5}" text-anchor="middle" font-size="15" font-weight="800">${n}</text>` : "";
    const gl = (sym, v) => v === undefined ? "" : v === sym ? sym : sym + " = " + v; // nur Symbol, wenn kein Wert
    const lab = (t, x, y, a = "middle") => t !== undefined && t !== "" ? `<text x="${x}" y="${y}" text-anchor="${a}" font-size="16" font-weight="700" fill="${TINTE}">${t}</text>` : "";
    return `<svg viewBox="-100 0 560 222" class="szene"><path d="M100 40 H260 V180 H100Z" fill="none" stroke="#aab3ba" stroke-width="26" stroke-linejoin="miter"/>
      ${sp(100, k1)}${sp(260, k2)}
      <path d="M70 70 H10 M70 170 H10 M290 70 H350 M290 170 H350" stroke="${TINTE}" stroke-width="2.5"/>
      ${lab(gl("U₁", w.u1), 2, 125, "end")}${lab(gl("U₂", w.u2), 358, 125, "start")}
      ${lab(gl("N₁", w.n1), 100, 214)}${lab(gl("N₂", w.n2), 260, 214)}
      ${nummern ? tag(nummern.spule1, 100, 22) + tag(nummern.spule2, 260, 22) + tag(nummern.kern, 180, 40) : ""}</svg>`;
  }

  const api = { stab, magnetPaar, ringe, kompass, feldStab, feldStabLinien, spaene, hufeisen, elementar, drahtQuer, oersted, spule, emKarte, motor, induktion, diagramm, trafo, FARBEN: { ROT, GRUEN, TINTE, BLAU, KUPFER, GRAU } };
  if (typeof module !== "undefined" && module.exports) module.exports = api; else root.Gr = api;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/* Aufgaben des Lernzirkels Magnetismus und Elektrizität (NT 8 M).
   Jede Aufgabe wird aus einem Baustein erzeugt: Reihenfolge der Antworten, Gegenstände, Bilder und Zahlen wechseln.
   Läuft im Browser (window.A) und in Node (Tests). Braucht grafik.js (Gr). */
(function (root) {
  "use strict";
  const Gr = root.Gr || (typeof require !== "undefined" ? require("./grafik.js") : null);

  /* ---------- Hilfen ---------- */
  const zuf = (r, n) => Math.floor(r() * n);

<script>
/* Oberfläche des Lernzirkels. Aufgaben: aufgaben.js (A), Grafiken: grafik.js (Gr), 3D: feld3d.js (Feld3D), Prüfcode: pass.js (Pass), Texte: inhalte.js (INHALT). */

  const SPEICHER = "magnetismus-zirkel-v1";

  const heute = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
  const img = (name, cls = "") => BILDER[name] ? `<img src="${BILDER[name]}" alt="" class="${cls}" draggable="false">` : "";

  /* ---------- Speicher ---------- */
  function leer() {

  const S = laden();

  /* ---------- Station ---------- */

      $("#heft-pruefen").addEventListener("click", () => {
        let r = 0; $$(".luecke", el).forEach((f, i) => { const ok = luecken[i].some(a => norm(a) === norm(f.value)); f.classList.toggle("ok", ok); f.classList.toggle("falsch", !ok); if (ok) r++; });
        const alle = r === luecken.length; if (alle && !S.heftFertig) { S.heftFertig = true; speichern(); }
        $("#heft-rueck").className = "rueck " + (alle ? "gut" : "schlecht");
        $("#heft-rueck").innerHTML = alle ? `<p class="urteil">Alles richtig! Jetzt ab ins Heft damit, dann weiter zu „3 Üben“.</p>` : `<p>${r} von ${luecken.length} Lücken stimmen. Die roten nochmal anschauen. Tipp: Die Lernschritte helfen.</p>`;
      });
      $("#heft-loesung").addEventListener("click", () => { $$(".luecke", el).forEach((f, i) => { f.value = luecken[i][0]; S.heft[i] = f.value; f.classList.add("ok"); f.classList.remove("falsch"); }); speichern(); $("#heft-rueck").className = "rueck"; $("#heft-rueck").innerHTML = "<p>Die Lösung steht jetzt drin. Lies sie dir durch und schreibe sie ins Heft.</p>"; });
    }
    if (teil === "ueben") {
      const st = S.st.wechsel;
      el.innerHTML = `<section class="uebung"><div class="uebung-kopf"><h2>Üben</h2><div class="stufen" role="group">${[1, 2, 3].map(n => `<button data-stufe="${n}" ${st.stufe === n ? 'aria-pressed="true"' : ""}>Stufe ${n}</button>`).join("")}</div></div><div id="aufgabe"></div></section>`;
      $$("[data-stufe]").forEach(b => b.addEventListener("click", () => { st.stufe = Number(b.dataset.stufe); st.serie = 0; speichern(); $$("[data-stufe]").forEach(x => x.setAttribute("aria-pressed", x === b)); neueAufgabe(); }));
      neueAufgabe();
    }
  }

  // Animationen für die Lernschritte
  function animStarten(el, art) {
    if (art === "bild") { el.innerHTML = img("wechsel", "anim-bild"); return; }
    if (art === "trafo") { el.innerHTML = img("trafo", "anim-bild"); return; }
    if (art === "generator") {
      el.innerHTML = `<svg viewBox="0 0 280 200" class="szene"><g id="rotor"><rect x="60" y="88" width="80" height="24" rx="4" fill="#e2503f" stroke="#1d2b26" stroke-width="2"/><rect x="140" y="88" width="80" height="24" rx="4" fill="#3f9d57" stroke="#1d2b26" stroke-width="2"/><text x="80" y="106" font-size="16" font-weight="800" fill="#fff">N</text><text x="194" y="106" font-size="16" font-weight="800" fill="#fff">S</text></g><circle cx="140" cy="100" r="5" fill="#1d2b26"/>
        ${[0, 1, 2, 3, 4].map(i => `<ellipse cx="${240 + i * 0}" cy="${60 + i * 20}" rx="22" ry="7" fill="none" stroke="#c8742f" stroke-width="3.5"/>`).join("")}
        <rect x="200" y="160" width="70" height="32" rx="6" fill="#fff" stroke="#1d2b26" stroke-width="2"/><path id="zeiger" d="M235 188 V168" stroke="#e2503f" stroke-width="3" stroke-linecap="round"/></svg>`;
      let w = 0, lauf = true; const rot = $("#rotor", el), z = $("#zeiger", el);
      const f = () => { if (!lauf) return; w += 1.6; rot.setAttribute("transform", `rotate(${w} 140 100)`); z.setAttribute("transform", `rotate(${(40 * Math.cos(w * Math.PI / 180)).toFixed(1)} 235 188)`); requestAnimationFrame(f); };
      requestAnimationFrame(f); aufraeumen.push(() => (lauf = false)); return;
    }
    // Stromkreis mit Elektronen, dazu Diagramm
    const wechsel = art === "wechsel";
    el.innerHTML = `<svg viewBox="0 0 280 170" class="szene"><rect x="30" y="20" width="220" height="110" rx="14" fill="none" stroke="#1d2b26" stroke-width="3"/>
      ${wechsel ? `<rect x="104" y="116" width="72" height="28" rx="6" fill="#fff" stroke="#1d2b26" stroke-width="2.5"/><circle cx="128" cy="130" r="4" fill="#1d2b26"/><circle cx="152" cy="130" r="4" fill="#1d2b26"/><text id="pl" x="140" y="162" text-anchor="middle" font-size="12" fill="#6b7680">Steckdose</text>` : `<rect x="100" y="118" width="80" height="24" rx="5" fill="#3a3f45"/><rect x="180" y="124" width="6" height="12" fill="#c8742f"/><text x="114" y="135" font-size="14" font-weight="800" fill="#fff">−</text><text x="160" y="135" font-size="14" font-weight="800" fill="#fff">+</text>`}
      <circle cx="140" cy="20" r="13" fill="#fff6c9" stroke="#1d2b26" stroke-width="2.5" id="birne"/><g id="elek"></g></svg>${window.Gr.diagramm(wechsel ? "wechsel" : "gleich", true)}`;
    const g = $("#elek", el), N = 16, U = 2 * (220 + 110);
    const punkt = u => { u = ((u % U) + U) % U; if (u < 220) return [30 + u, 20]; if (u < 330) return [250, 20 + (u - 220)]; if (u < 550) return [250 - (u - 330), 130]; return [30, 130 - (u - 550)]; };
    g.innerHTML = Array.from({ length: N }, () => `<circle r="4.5" fill="#2f6fd6"/>`).join("");
    const kreise = $$("circle", g); let t0 = performance.now(), lauf = true;
    const f = t => { if (!lauf) return; const s = (t - t0) / 1000; const off = wechsel ? 26 * Math.sin(s * 2.4) : s * 40; kreise.forEach((c, i) => { const [x, y] = punkt(i * U / N + (wechsel ? off : -off)); c.setAttribute("cx", x); c.setAttribute("cy", y); }); requestAnimationFrame(f); };
    requestAnimationFrame(f); aufraeumen.push(() => (lauf = false));
  }

  /* ---------- Start-Check und Generalprobe ---------- */
  function laufStarten(art) {
    const aufgaben = art === "check" ? startCheck() : mischen(PUNKTE.map(p => erzeugePunkt(p.id)), Math.random);
    gehe({ art: "lauf", lauf: { art, aufgaben, i: 0, erg: [] } });
  }
  function laufZeichnen() {
    const L = ansicht.lauf, el = $("#inhalt");
    if (L.i >= L.aufgaben.length) return laufEnde();
    const t = L.aufgaben[L.i];
    el.innerHTML = `<div class="lauf-kopf"><h1>${L.art === "check" ? "Start-Check" : "Generalprobe"}</h1><div class="fortschritt"><div style="width:${100 * L.i / L.aufgaben.length}%"></div></div><p class="klein">Aufgabe ${L.i + 1} von ${L.aufgaben.length}${L.art === "general" ? " · ohne Zeitdruck · alle Kann-Punkte" : " · eine Frage pro Station"}</p></div><div id="lauf-aufgabe"></div>`;
    aufgabeZeichnen($("#lauf-aufgabe"), t, (richtig, zaehlt) => {
      L.erg[L.i] = richtig;
      let msg = "";
      if (L.art === "general" && richtig && t.punkt && !S.liste[t.punkt]) { S.liste[t.punkt] = heute(); msg = `<p class="zaehler">Kann-Punkt abgehakt</p>`; }
      if (zaehlt && !schonGezaehlt(t)) { S.geloest++; if (t.stufe >= 2) S.geloest23++; S.gezaehlt.keys.push(zaehlKey(t)); }
      speichern(); return msg;
    }, { meta: station(t.station) ? `Station ${station(t.station).nr}: ${station(t.station).name}` : "", weiterText: L.i < L.aufgaben.length - 1 ? "Weiter" : "Auswertung", weiter: () => { L.i++; laufZeichnen(); window.scrollTo(0, 0); } });
  }
  function laufEnde() {
    const L = ansicht.lauf, r = L.erg.filter(Boolean).length, el = $("#inhalt");
    if (L.art === "check") {
      S.check = {}; L.aufgaben.forEach((t, i) => (S.check[t.checkStation] = L.erg[i] ? "gruen" : "rot")); speichern();
      el.innerHTML = `<section class="ende">${img("start", "ende-bild")}<h1>${r} von ${L.aufgaben.length} richtig</h1><p>Die Stationen mit roter Markierung solltest du zuerst üben. Grün heißt: Das sitzt schon ganz gut, eine Runde Üben schadet trotzdem nicht.</p>
        <div class="check-liste">${L.aufgaben.map((t, i) => { const s = station(t.checkStation); return `<button class="check-zeile ${L.erg[i] ? "gruen" : "rot"}" data-station="${s.id}"><span class="punkt"></span>Station ${s.nr}: ${s.name}</button>`; }).join("")}</div><button class="knopf" data-go="start">Zu den Stationen</button></section>`;
    } else {
      S.generalprobe = Math.max(S.generalprobe || 0, r); speichern();
      el.innerHTML = `<section class="ende">${img("pass", "ende-bild")}<h1>Generalprobe: ${r} von ${L.aufgaben.length}</h1><p>${r === L.aufgaben.length ? "Alles richtig. Du bist richtig gut vorbereitet!" : r >= L.aufgaben.length * .75 ? "Stark. Schau dir in der Checkliste die offenen Punkte nochmal an." : "Guter Anfang. Übe die Stationen, deren Punkte in der Checkliste noch offen sind, und versuch es dann nochmal."}</p><p class="klein">Bestes Ergebnis bisher: ${S.generalprobe} von ${L.aufgaben.length}</p><div class="knoepfe"><button class="knopf" data-go="liste">Zur Checkliste</button><button class="knopf zwei" data-go="pass">Zum Lernpass</button></div></section>`;
    }
    $$("[data-go]", el).forEach(b => b.addEventListener("click", () => gehe({ art: b.dataset.go })));
    $$("[data-station]", el).forEach(b => b.addEventListener("click", () => gehe({ art: "station", id: b.dataset.station })));
  }

  /* ---------- Checkliste ---------- */
  function listeSeite() {
    const k = kannZahl();
    return `<section class="liste-kopf"><div><h1>Checkliste</h1><p>Das brauchst du für den Leistungsnachweis. Tippe auf „Testen“: Löst du die Testaufgabe richtig, wird der Punkt abgehakt. Die Themen sind die vom Lernzettel.</p>
      <div class="balken"><div style="width:${100 * k / PUNKTE.length}%"></div></div><p class="klein">${k} von ${PUNKTE.length} abgehakt${S.generalprobe !== null ? ` · Generalprobe bisher: ${S.generalprobe} von ${PUNKTE.length}` : ""}</p>
      <button class="knopf" id="generalprobe">Generalprobe: alle ${PUNKTE.length} Punkte nacheinander</button></div>${img("start", "liste-bild")}</section>
      ${CHECKLISTE.map((g, gi) => `<section class="liste-gruppe"><h2><span class="gruppen-nr">${gi + 1}</span>${g.thema}</h2>${g.punkte.map(p => `<div class="kann ${S.liste[p.id] ? "ja" : ""}"><span class="kasten">${S.liste[p.id] ? haken() : ""}</span><p>${p.text}</p><button class="knopf klein-knopf ${S.liste[p.id] ? "zwei" : ""}" data-test="${p.id}">${S.liste[p.id] ? "Nochmal" : "Testen"}</button></div>`).join("")}<button class="link" data-station="${g.station}">Zur Station ${station(g.station).nr}: ${station(g.station).name}</button></section>`).join("")}
      <p class="klein">Tipp vom Lernzettel: Erkläre die Themen jemandem zu Hause in eigenen Worten und übe die Zeichnungen aus dem Heft einmal auf einem Blatt.</p>`;
  }
  function listeVerbinden() { $$("[data-test]").forEach(b => b.addEventListener("click", () => gehe({ art: "test", id: b.dataset.test }))); }
  function testZeichnen() {
    const p = PUNKTE.find(x => x.id === ansicht.id), t = erzeugePunkt(p.id), el = $("#inhalt");
    el.innerHTML = `<div class="lauf-kopf"><button class="link" id="zurueck">← Checkliste</button><h1>Testaufgabe</h1><p class="kann-text">„${p.text}“</p></div><div id="test-aufgabe"></div>`;
    $("#zurueck").addEventListener("click", () => gehe({ art: "liste" }));
    aufgabeZeichnen($("#test-aufgabe"), t, (richtig, zaehlt) => {
      let msg = "";
      if (richtig) { if (!S.liste[p.id]) msg = `<p class="zaehler">Abgehakt!</p>`; S.liste[p.id] = heute(); }
      else msg = `<p class="klein">Übe an Station ${station(p.station).nr} und teste dich dann nochmal.</p>`;
      if (zaehlt && !schonGezaehlt(t)) { S.geloest++; S.geloest23++; S.gezaehlt.keys.push(zaehlKey(t)); }
      speichern(); return msg;
    }, { meta: p.thema, weiterText: "Zurück zur Checkliste", weiter: () => gehe({ art: "liste" }) });
  }

  /* ---------- Lernpass ---------- */
  function passWerte() { return { geloest: S.geloest, geloest23: S.geloest23, kann: kannZahl(), abzeichen: abzeichenZahl(), minuten: Math.floor(S.sekunden / 60), tage: lerntage() }; }
  function passSeite() {
    const w = passWerte(), code = window.Pass.codeErzeugen(w);
    const d = new Date();
    return `<section class="pass"><div class="pass-kopf">${img("pass", "pass-bild")}<div><div class="ueber">NT 8 · Magnetismus und Elektrizität</div><h1>Mein Lernpass</h1><p>Zeig ihn deiner Lehrkraft. Schreib den Code in dein Heft oder mach einen Screenshot. Stand: ${d.toLocaleDateString("de-DE")}</p></div></div>
      <div class="pass-zahlen">
        <div class="pz"><b>${w.geloest}</b><span>Aufgaben gelöst</span><small>davon ${w.geloest23} auf Stufe 2 oder 3</small></div>
        <div class="pz"><b>${w.kann}/${PUNKTE.length}</b><span>Kann-Punkte abgehakt</span><small>${S.generalprobe !== null ? `Generalprobe: ${S.generalprobe}/${PUNKTE.length}` : "Generalprobe noch offen"}</small></div>
        <div class="pz"><b>${w.abzeichen}/${STATIONEN.length}</b><span>Abzeichen</span><small>${STATIONEN.filter(s => S.st[s.id].abzeichen).map(s => s.nr).join(", ") || "noch keins"}</small></div>
        <div class="pz"><b id="zeit-live">${minutenText(S.sekunden)}</b><span>aktive Lernzeit</span><small>an ${w.tage} Lerntag${w.tage === 1 ? "" : "en"} (ab 5 Minuten)</small></div>
      </div>
      <div class="code-box"><span>Prüfcode</span><b>${code}</b><small>Deine Lehrkraft kann damit nachprüfen, dass die Zahlen echt sind.</small></div>
      <div class="knoepfe"><button class="knopf" id="drucken">Lernpass drucken oder als PDF</button></div>
      <details class="regeln"><summary>So wird gezählt</summary><ul>
        <li>Eine Aufgabe zählt, wenn du sie richtig löst: Auswahlaufgaben nur beim ersten Versuch, Rechen-, Sortier- und Reihenfolge-Aufgaben auch beim zweiten.</li>
        <li>Jede Aufgabe zählt pro Tag einmal. Beim Trafo-Rechnen sind es immer neue Zahlen, also neue Aufgaben.</li>
        <li>Lernzeit läuft nur, wenn die Seite offen ist und du in der letzten Minute etwas getippt hast. Liegenlassen zählt nicht.</li>
        <li>Alles bleibt nur auf diesem Gerät. Bleib bei einem Gerät und einem Browser. Wer den Verlauf oder die Websitedaten löscht, fängt von vorne an.</li>
      </ul></details>
      <details class="regeln"><summary>Neu anfangen</summary><p>Löscht deinen ganzen Fortschritt auf diesem Gerät. Das lässt sich nicht rückgängig machen.</p><button class="knopf rot" id="zuruecksetzen">Alles löschen</button></details></section>`;
  }
  function passVerbinden() {
    $("#drucken").addEventListener("click", () => window.print());
    $("#zuruecksetzen").addEventListener("click", () => { if (confirm("Wirklich den ganzen Fortschritt löschen?")) { const l = leer(); Object.keys(S).forEach(k => delete S[k]); Object.assign(S, l); speichern(); gehe({ art: "start" }); } });
  }

  zeichnen();
})();

</script>
